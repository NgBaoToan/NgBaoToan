name: Refresh Codeforces profile

on:
  schedule:
    - cron: "17 0,12 * * *"   # 07:17 và 19:17 giờ Việt Nam (UTC+7)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-codeforces
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Codeforces card
        run: python3 scripts/update_codeforces.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/codeforces-live.svg data/codeforces.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: refresh Codeforces snapshot"
          git pull --rebase
          git push
